<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reserve_Sin — движение средств</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Reserve_Sin</p>
      <h1>Движение средств</h1>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Загрузка движения средств…</p>
    <div id="error" class="error" role="alert" hidden>
      <p id="error-message">Не удалось загрузить историю.</p>
      <button id="retry" type="button">Обновить</button>
    </div>
    <p id="empty" class="empty" hidden>В движении средств пока нет операций.</p>

    <div id="table-wrap" class="table-wrap" hidden tabindex="0" aria-label="Таблица движения средств">
      <table id="transactions"></table>
    </div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
